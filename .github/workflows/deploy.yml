# Nasadenie na hosting cez FTP po každom pushi do vetvy main.
# Potrebné GitHub Secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER      napr. ftp.websupport.sk  (bez ftp://)
#   FTP_USERNAME    FTP používateľ
#   FTP_PASSWORD    FTP heslo
#   FTP_REMOTE_DIR  cieľový adresár na serveri, napr. /sub/meet/   (musí končiť lomkou)
name: Deploy (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, curl, pdo_mysql
          tools: composer:v2

      - name: Composer install (vendor sa nahrá na server, hosting nepotrebuje Composer)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-scripts

      - name: Lint PHP
        run: find src public bin -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Upload cez FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          protocol: ftps
          local-dir: ./
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .env
            .env.example
            storage/audio/**
            storage/logs/**
            docker/**
            docker-compose.yml
            .dockerignore
            README.md
