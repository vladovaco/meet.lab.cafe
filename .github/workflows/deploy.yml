# Nasadenie cez SSH po každom pushi do main.
# GitHub Secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST   adresa servera, napr. shellserver.websupport.sk
#   SSH_USER   SSH používateľ, napr. uid138628
#   SSH_KEY    privátny SSH kľúč (celý obsah súboru, verejná časť musí byť v ~/.ssh/authorized_keys na serveri)
#   SSH_PASSWORD  alternatíva ku kľúču: SSH heslo (stačí jedno z SSH_KEY / SSH_PASSWORD)
#   APP_DIR    adresár aplikácie na serveri, napr. /data/4/a/.../lab.cafe/sub/meet  (alebo ~/lab.cafe/sub/meet)
# Voliteľné secrets: SSH_PORT (22). Voliteľná premenná (Variables): PHP_BIN (napr. php83), ak "php" na serveri nie je 8.1+.
name: Deploy (SSH)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Composer validate
        run: composer validate --no-check-publish --strict
      - name: Lint PHP
        run: find src public bin -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy cez SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 15m
          envs: PHP_BIN
          script: |
            cd "${{ secrets.APP_DIR }}"
            git fetch --quiet origin main
            git checkout --quiet -B main origin/main
            git reset --quiet --hard origin/main
            PHP_BIN="${PHP_BIN:-php}" bash bin/deploy.sh
        env:
          PHP_BIN: ${{ vars.PHP_BIN }}
